name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.julia }} - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1']
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - julia: '1.11'
            os: ubuntu-latest
          - julia: 'pre'
            os: ubuntu-latest
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    env:
      DECIMALS_RUN_TRIM_TESTS: '0'
      JULIA_NUM_PRECOMPILE_TASKS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-runtest@v1
  trim:
    name: Trim compile and execute
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - run: julia --project=test/trim -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - run: julia --project=test/trim test/trim/runtests.jl
  json:
    name: JSON 1 and Parsers 2 - Julia ${{ matrix.version }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Install JSON test environment
        run: julia --project=test/json -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Test exact JSON output and Parsers 2 coexistence
        run: julia --project=test/json test/json/runtests.jl
